[package]
name = "proxy-mitm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# rcgen + rustls reached via hudsucker::rcgen / hudsucker::rustls re-exports.
hudsucker = { workspace = true }
# proxy-core wires in for outbound redaction + inbound reverse.
proxy-core = { path = "../proxy-core" }
http-body-util = "0.1"
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
