[package]
name = "proxy-mitm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# rcgen + rustls reached via hudsucker::rcgen / hudsucker::rustls re-exports.
hudsucker = { workspace = true }
# proxy-core wires in for outbound redaction + inbound reverse.
proxy-core = { path = "../proxy-core" }
http-body-util = "0.1"
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Phase 2c: the SSE-aware streaming reverser wraps the upstream byte
# stream with futures_util::stream::unfold.
futures-util = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
# h2 + http are used by the HTTP/2 multiplex race regression test, which
# drives the proxy over raw TCP with two concurrent streams sharing one
# `client_addr`. We can't reproduce the race with reqwest because its
# HTTP/1.1 pool refuses to pipeline; the deterministic repro needs an
# HTTP/2 client we can fully control on a single connection.
h2 = "0.4"
http = "1"
