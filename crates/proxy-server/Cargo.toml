[package]
name = "proxy-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# proxy-core wires in for Phase-1 outbound redaction and Phase-2b
# whole-response reversal. Phase 2c (per-event SSE reversal) is the
# remaining streaming-UX gap.
proxy-core = { path = "../proxy-core" }
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# System-prompt injection parses the redacted request body as JSON,
# mutates it via `proxy_core::system_prompt::inject_*`, and re-serializes.
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde_json = { workspace = true }
