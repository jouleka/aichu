[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/proxy-mitm",
    "crates/proxy-server",
    "crates/cli",
    "experiments/e03-placeholder-eval",
]

[workspace.package]
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jouleka/aichu"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
hyper = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Experiment-specific
# hudsucker 0.24 uses native async-in-trait (Rust 1.75+), `Issuer` type, and
# `with_rustls_connector` (renamed from `with_rustls_client`). The build plan
# at docs/build-plan.md references 0.19 — that doc is archived; this is the
# version we actually build against.
# hudsucker re-exports `rcgen` and `rustls` so we use those paths directly
# instead of pinning duplicates here — that would force version skew with
# whatever hudsucker selects internally.
hudsucker = { version = "0.24", features = ["full", "http2", "rcgen-ca", "rustls-client"] }
axum = "0.7"
eventsource-stream = "0.2"
regex = "1.11"
aho-corasick = "1.1"
async-trait = "0.1"
tempfile = "3"
