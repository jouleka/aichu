[package]
name = "e02-base-url-relay"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "e02-base-url-relay"
path = "src/main.rs"

[dependencies]
# eventsource-stream is workspace-declared but unused in this experiment for
# now — we pass-through bytes via reqwest's bytes_stream(). We'll wire it in
# when redaction lands in proxy-core; until then, no need to compile it here.
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde_json = { workspace = true }
